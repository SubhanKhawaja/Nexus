name: nexus
description: "Nexus — Cross-platform POS & Accounting System"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter

  # State Management (manual providers — no codegen needed)
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # Database (Drift / SQLite)
  drift: ^2.22.1
  drift_flutter: ^0.2.4
  sqlite3_flutter_libs: ^0.5.24

  # Firebase (offline-sync backbone)
  firebase_core: ^3.12.1
  cloud_firestore: ^5.6.7

  # UI Utilities
  intl: ^0.20.0
  fl_chart: ^0.71.0
  google_fonts: ^6.2.1

  # Icons
  cupertino_icons: ^1.0.8
  flutter_localizations:
    sdk: flutter
  firebase_auth: ^5.7.0
  google_sign_in: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Drift code generation
  drift_dev: ^2.22.1
  build_runner: ^2.4.13

  # App icon generation
  flutter_launcher_icons: ^0.14.3

flutter:
  generate: true
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
  windows:
    generate: true
  image_path: "assets/screen.png"
  remove_alpha_ios: true
  background_color_ios: "#ffffff"
